[workspace]
members = [
    ".",
    "memory_access",
    "tests/integration_test",
    "tests/psci_test",
]

[package]
name = "ritm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A reference implementation of an EL2 shim for enabling hypervisor policy enforcement on Android devices with unlocked bootloaders."
authors = ["Mateusz Maćkowski <mmac@google.com>"]
repository = "https://github.com/google/ritm"
keywords = ["android", "aarch64", "boot", "security"]
categories = ["embedded", "no-std"]

[dependencies]
aarch64-paging = "0.12"
aarch64-rt = { version = "0.4.3", features = ["el2", "exceptions", "initial-pagetable", "psci"], default-features = false }
arm-pl011-uart = "0.5"
arm-psci = "0.2"
arm-sysregs = { version = "0.3", features = ["el1", "el2"] }
arrayvec = { version = "0.7", default-features = false }
buddy_system_allocator = { version = "0.13", default-features = false, features = ["alloc", "use_spin"] }
dtoolkit = { version = "0.4", features = ["write"] }
embedded-io = "0.7"
log = "0.4"
memory_access = { path = "memory_access" }
percore = "0.2"
smccc = "0.2"
spin = { version = "0.12", features = ["lazy", "once", "spin_mutex"], default-features = false }
thiserror = { version = "2", default-features = false }

[lints.rust]
deprecated-safe = "warn"
keyword-idents = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
